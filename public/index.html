<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/><meta name="referrer" content="no-referrer"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"/>
<title>Crew Social Agent — Private Inbox</title><link rel="stylesheet" href="/styles.css"/></head>
<body><main class="shell">
  <header><div><p class="kicker">CREW LAB</p><h1>Social Agent</h1><p class="subtitle">Threads + Facebook 私人社群收件匣</p></div><span class="pill">審核後發布</span></header>
  <section class="panel connection"><label for="key">管理員金鑰（只保留在當前頁面記憶體）</label>
    <div class="line"><input type="password" id="key" autocomplete="off" placeholder="輸入 SOCIAL_ADMIN_KEY"/><button id="connect">連線</button><button id="forget" class="secondary">清除</button></div>
    <p id="status" class="hint" role="status">尚未連線。設定 Cloudflare Secret 才能連接。</p>
  </section>
  <section class="panel"><h2>建立新貼文</h2>
    <label class="draft-label" for="postText">貼文內容</label><textarea id="postText" rows="4" placeholder="寫好要發布的文字，會發布到下方選取的平台"></textarea>
    <label class="draft-label" for="postImage">圖片網址（選填，需為公開 HTTPS 圖片）</label><input id="postImage" type="url" placeholder="https://.../photo.jpg"/>
    <p class="hint">目前支援文字及公開圖片網址；對話附件圖片上傳與 R2 尚未接入。點擊發布後會再次要求確認。</p>
    <button id="publish">核准並發布新貼文</button>
  </section>
  <div class="toolbar"><div class="tabs"><button id="threads" class="tab active" aria-pressed="true">Threads</button><button id="facebook" class="tab" aria-pressed="false">Facebook</button></div><button id="refresh" class="secondary">重新整理</button></div>
  <div class="columns"><section class="panel"><h2>我的貼文</h2><div id="posts" class="stack"><p class="hint">連線後顯示</p></div></section>
  <section class="panel"><h2>留言與回覆</h2><p id="selected" class="hint">先選擇一則貼文</p><div id="comments" class="stack"></div></section></div>
  <section class="panel"><h2>發布紀錄</h2><button id="historyButton" class="secondary">查看最近紀錄</button><div id="history" class="stack"></div></section>
  <footer>僅管理員使用。AI 只產生草稿；真正的回覆必須逐則人工確認。遇到發布結果不明時不自動重發。</footer>
</main><script src="/app.js" defer></script></body></html>
