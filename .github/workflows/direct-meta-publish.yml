name: Direct Meta publish

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Owner-created social publication issue number"
        type: number
        required: true
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: social-publish-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner &&
       github.event.label.name == 'social-publish')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate and publish direct to Meta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOCIAL_ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: node scripts/publish-social-issue.mjs
