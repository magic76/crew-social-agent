name: Temporary Koolo Gemini video render
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/koolo-video-temp.yml"
      - "scripts/koolo_video_temp.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install pillow numpy
      - name: Render 21.5s visual
        run: |
          OUT=/tmp/koolo-render python scripts/koolo_video_temp.py
      - name: Fetch Gemini Kore WAV
        run: |
          curl --fail --retry 3 --retry-delay 2 --connect-timeout 15             "https://crew-guest-trial.shanliyoung.workers.dev/api/video/tts/result?id=crew-tts-koolo-demo-20261123"             -o /tmp/koolo-render/kore.wav
          ffprobe -v error -show_entries format=duration,size -of json /tmp/koolo-render/kore.wav
      - name: Mix narration and subtle bed
        run: |
          ffmpeg -hide_banner -loglevel error -y             -i /tmp/koolo-render/visual.mp4             -i /tmp/koolo-render/kore.wav             -f lavfi -i "sine=frequency=110:sample_rate=48000:duration=21.5"             -f lavfi -i "sine=frequency=165:sample_rate=48000:duration=21.5"             -filter_complex "[1:a]adelay=450|450,volume=1.0[voice];[2:a]volume=0.018[bed1];[3:a]volume=0.011[bed2];[bed1][bed2]amix=inputs=2:normalize=0,lowpass=f=900,afade=t=in:st=0:d=1,afade=t=out:st=19.5:d=2[bed];[bed][voice]amix=inputs=2:normalize=0:duration=longest,alimiter=limit=0.92,loudnorm=I=-16:TP=-1.5:LRA=8[a]"             -map 0:v:0 -map "[a]"             -vf "scale=1080:1920:flags=lanczos,fps=30"             -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p             -c:a aac -b:a 192k -movflags +faststart -t 21.5             /tmp/koolo-render/koolo_21_5s_gemini_kore.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -of json /tmp/koolo-render/koolo_21_5s_gemini_kore.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: koolo-21-5s-gemini-kore
          path: /tmp/koolo-render/koolo_21_5s_gemini_kore.mp4
          retention-days: 1
